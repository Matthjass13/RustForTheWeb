# this file initialises the Axum, Python, and PostgresDB containers

services:
  postgres:
    image: postgres:latest
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init_script.sql:/docker-entrypoint-initdb.d/init_script.sql  # mount directly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-mydb}"]  
      interval: 5s
      timeout: 5s
      retries: 5
    
  axum_be:
    build:
      context: ./Axum
      dockerfile: Dockerfile
    container_name: axum_be
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-mydb}
    depends_on:
      postgres:
        condition: service_healthy

  python_be:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_HOST: postgres
    build:
      context: ./PythonApp
      dockerfile: Dockerfile
    container_name: python_be
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: > 
      sh -c "python manage.py migrate --noinput &&
            python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:



