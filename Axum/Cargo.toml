[package]
name = "AxumSite"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"]}
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenv = "0.15"
redis = "1.1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

